<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HostelHunter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body
    style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main);">
    <div
        style="background: var(--white); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08); border: 1px solid var(--border); text-align: center;">

        <h2 style="color: var(--text); margin-bottom: 8px;">Create Account</h2>
        <img src="icon.jpeg" style="width:100px; height:100px; object-fit: contain;">
        <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 24px;">Join HostelHunter to book or list
            student housing</p>

        <!-- Inline Error / Success Alert Box -->
        <div id="errorMessage"
            style="display: none; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; text-align: left;">
        </div>

        <form id="registerForm" onsubmit="handleXamppRegister(event)">
            <!-- Account Type Selector -->
            <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                <label for="accountType"
                    style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color: var(--muted);">I am
                    registering as a:</label>
                <select id="accountType" name="account_type"
                    style="width:100%; height:46px; padding:0 14px; border:1px solid var(--border); border-radius:10px; background:var(--bg-light); color: var(--text);">
                    <option value="student">Student (Tenant)</option>
                    <option value="vendor">Hostel Owner / Vendor</option>
                </select>
            </div>

            <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                <label for="fullName"
                    style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color: var(--muted);">Full
                    Name</label>
                <input type="text" id="fullName" name="full_name" required placeholder="Okuta Joshua Tash"
                    style="width:100%; height:46px; padding:0 14px; border:1px solid var(--border); border-radius:10px; background:var(--bg-light); color: var(--text);">
            </div>

            <div class="form-group" style="text-align: left; margin-bottom: 16px;">
                <label for="email"
                    style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color: var(--muted);">Email
                    Address</label>
                <input type="email" id="email" name="email" required placeholder="student@university.ac.ug"
                    style="width:100%; height:46px; padding:0 14px; border:1px solid var(--border); border-radius:10px; background:var(--bg-light); color: var(--text);">
            </div>

            <!-- Password Field with Embedded View Toggle -->
            <div class="form-group" style="text-align: left; margin-bottom: 24px;">
                <label for="password"
                    style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color: var(--muted);">Password</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="password" name="password" required placeholder="••••••••"
                        style="width:100%; height:46px; padding:0 45px 0 14px; border:1px solid var(--border); border-radius:10px; background:var(--bg-light); color: var(--text);">
                    <button type="button" onclick="toggleRegisterPassword()" id="toggleRegisterPasswordBtn"
                        style="position: absolute; right: 12px; background: none; border: none; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600;">Show</button>
                </div>
            </div>

            <button type="submit" id="registerBtn" class="btn btn-primary full-width" style="height: 48px;">Create
                Account</button>
        </form>

        <p style="font-size: 0.85rem; color: var(--muted); margin-top: 20px;">
            Already have an account? <a href="login.html"
                style="color: var(--primary); text-decoration: none; font-weight: 600;">Login here</a>
        </p>
        <p style="font-size: 0.8rem; margin-top: 10px;">
            <a href="index.html" style="color: var(--muted); text-decoration: none;">&larr; Back to Home</a>
        </p>
    </div>

    <script>
        // Password Visibility Toggle
        function toggleRegisterPassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('toggleRegisterPasswordBtn');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        }

        // Register AJAX Request to Backend with exact underscore path
        async function handleXamppRegister(event) {
            event.preventDefault();
            const errorBox = document.getElementById('errorMessage');
            const registerBtn = document.getElementById('registerBtn');

            errorBox.style.display = 'none';
            registerBtn.disabled = true;
            registerBtn.textContent = 'Creating Account...';

            const accountType = document.getElementById('accountType').value;
            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('./back_end/log_reg/register.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        full_name: fullName,
                        email: email,
                        password: password,
                        account_type: accountType
                    })
                });

                const result = await response.json();

                if (result.success) {
                    localStorage.setItem('campus_user_logged_in', 'true');
                    localStorage.setItem('campus_account_type', result.account_type);
                    localStorage.setItem('campus_user_name', fullName);

                    errorBox.style.display = 'block';
                    errorBox.style.background = '#dcfce7';
                    errorBox.style.border = '1px solid #86efac';
                    errorBox.style.color = '#15803d';
                    errorBox.textContent = 'Account created successfully! Redirecting...';

                    setTimeout(() => {
                        window.location.href = result.redirect;
                    }, 800);
                } else {
                    errorBox.style.display = 'block';
                    errorBox.style.background = '#fef2f2';
                    errorBox.style.border = '1px solid #fecaca';
                    errorBox.style.color = '#dc2626';
                    errorBox.textContent = result.message || 'Registration failed. Please check your details.';
                    registerBtn.disabled = false;
                    registerBtn.textContent = 'Create Account';
                }
            } catch (error) {
                console.error('Registration Error:', error);
                errorBox.style.display = 'block';
                errorBox.style.background = '#fef2f2';
                errorBox.style.border = '1px solid #fecaca';
                errorBox.style.color = '#dc2626';
                errorBox.textContent = 'Unable to connect to the server. Please ensure XAMPP Apache and MySQL are running.';
                registerBtn.disabled = false;
                registerBtn.textContent = 'Create Account';
            }
        }
    </script>
</body>

</html>
